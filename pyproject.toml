[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-blast"
version = "0.1.0"
description = "Full-screen karaoke video player and manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "python-vlc>=3.0",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[project.scripts]
karaoke-blast = "karaoke_blast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"karaoke_blast.assets" = ["*.png", "*.ico"]

[tool.ruff]
line-length = 100
target-version = "py311"
